[project]
name = "calle"
version = "0.1.0"
description = "CALL-E: a real-time AI sales voice agent built on Pipecat."
authors = [
    { name = "Eightalmond", email = "roshanrajiv04@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "certifi>=2026.7.22",
    "fastapi>=0.143.0",
    "pipecat-ai[deepgram,groq,runner,silero,webrtc]>=1.12.0",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
